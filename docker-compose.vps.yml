# Deployment for the VPS that already runs the "uzy" stack behind Caddy.
#
# Caddy (uzy-caddy-1) owns ports 80/443 and terminates TLS for everything on
# this host. This file therefore starts NO nginx, NO certbot, and binds NO host
# ports at all — the API joins Caddy's Docker network and is reachable only as
# `video_downloader_api:8000` from inside that network.
#
# Nothing here can collide with the existing stack: no host port is claimed, and
# port 9000 (MinIO) and 3000-3002/5432/5555/5556 are untouched.
#
#   docker compose -f docker-compose.vps.yml up -d --build
#
# CADDY_NETWORK must name the network Caddy is on. Find it with:
#   docker inspect uzy-caddy-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'

services:
  api:
    build: .
    image: video-downloader-api
    container_name: video_downloader_api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
      NODE_ENV: production
    volumes:
      # The image runs as the `node` user (uid 1000). Bind mounts keep the
      # HOST's ownership, overriding the image's chown, so both of these must
      # be owned by 1000:1000 on the host or the API cannot write to them:
      #   sudo chown -R 1000:1000 downloads cookies.txt
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt
    networks:
      - caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No `ports:` on purpose. If you ever need to reach the API from the host
    # for debugging, prefer `docker exec` over opening a port:
    #   docker exec video_downloader_api \
    #     node -e "fetch('http://127.0.0.1:8000/api/health').then(r=>r.text()).then(console.log)"

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-uzy_default}
