services:
  api:
    build: .
    image: video-downloader-api
    container_name: video_downloader_api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
      NODE_ENV: production
    volumes:
      # Persist converted files and the cookie jar across restarts.
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt
    expose:
      - "8000"
    ports:
      # Bound to localhost only; nginx is the public entrypoint.
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    container_name: video_downloader_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: video_downloader_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
