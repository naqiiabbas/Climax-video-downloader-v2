# NOT for the shared VPS — use docker-compose.vps.yml there.
#
# This file binds ports 80/443/8000 directly and runs its own nginx+certbot.
# On 2026-09-11 a stray `docker compose up` on the VPS (missing `-f
# docker-compose.vps.yml`) silently picked THIS file up instead, attaching
# the API container to Compose's own default network — invisible to the
# Caddy instance that actually owns 80/443 on that host — and spawning two
# containers (nginx, certbot) that should never have existed there. Renamed
# from docker-compose.yml specifically so a bare `docker compose up` (no -f)
# fails outright instead of silently doing this again. See
# deploy/VPS-DEPLOY.md for the VPS deployment path.
#
# This file is for a standalone deploy with no existing reverse proxy on the
# box — its own nginx does TLS via Let's Encrypt/certbot directly.

services:
  api:
    build: .
    image: video-downloader-api
    container_name: video_downloader_api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
      NODE_ENV: production
    volumes:
      # Persist converted files and the cookie jar across restarts.
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt
    expose:
      - "8000"
    ports:
      # Bound to localhost only; nginx is the public entrypoint.
      - "127.0.0.1:8000:8000"

  nginx:
    image: nginx:alpine
    container_name: video_downloader_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: video_downloader_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
