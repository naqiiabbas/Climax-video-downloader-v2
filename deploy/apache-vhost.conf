# Add this to the Apache ALREADY running on the VPS.
#
#   /etc/apache2/sites-available/video-downloader.conf   (Debian/Ubuntu)
#   /etc/httpd/conf.d/video-downloader.conf              (RHEL/Alma/Rocky)
#
# Enable the proxy modules first, then the site:
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite video-downloader
#   sudo apachectl configtest     # MUST pass before reloading
#   sudo systemctl reload apache2
#
# Certificate via the existing certbot:
#   sudo certbot --apache -d downloader.example.com
#
# Replace downloader.example.com with your subdomain, and 8090 with HOST_PORT.

<VirtualHost *:80>
    ServerName downloader.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Extraction and merge jobs run long; the default timeout would cut them off.
    ProxyPass        / http://127.0.0.1:8090/ timeout=900 connectiontimeout=30
    ProxyPassReverse / http://127.0.0.1:8090/

    RequestHeader set X-Forwarded-Proto "http"

    # cookies.txt uploads.
    LimitRequestBody 10485760

    ErrorLog  ${APACHE_LOG_DIR}/video-downloader-error.log
    CustomLog ${APACHE_LOG_DIR}/video-downloader-access.log combined
</VirtualHost>
