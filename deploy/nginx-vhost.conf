# Add this to the nginx ALREADY running on the VPS.
#
#   /etc/nginx/sites-available/video-downloader   (Debian/Ubuntu)
#   /etc/nginx/conf.d/video-downloader.conf       (RHEL/Alma/Rocky)
#
# Then:
#   sudo ln -s /etc/nginx/sites-available/video-downloader /etc/nginx/sites-enabled/
#   sudo nginx -t          # MUST pass before reloading — a bad config takes the existing site down
#   sudo systemctl reload nginx
#
# Get the certificate with the existing certbot, which will fill in the TLS
# lines below automatically:
#   sudo certbot --nginx -d downloader.example.com
#
# Replace downloader.example.com with your subdomain, and 8090 with HOST_PORT.

server {
    listen 80;
    listen [::]:80;
    server_name downloader.example.com;

    # certbot rewrites this block to redirect to https once the cert is issued.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extraction runs yt-dlp and can take 30s; a merge job runs far longer.
        # The defaults (60s) would cut these off mid-download.
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # cookies.txt uploads.
    client_max_body_size 10M;

    # Converted files are large. Streaming them straight through avoids nginx
    # buffering an entire video to disk before sending a byte.
    location /downloads/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
    }
}
